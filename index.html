<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#3498db">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="Expenses">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <title>Expense Tracker</title>

    <script src="chart.umd.min.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <div class="app-toolbar">

            <button id="installBtn" hidden>Install App</button>

            <button id="exportBtn">Export Backup</button>

            <button id="importBtn">Import Backup</button>

            <input type="file" id="importFile" accept="application/json,.json" hidden>

        </div>

        <p class="hint" id="iosHint" hidden>On iPhone: tap Share &rarr; "Add to Home Screen"</p>

        <div class="balance-section">

            <div class="balance-card"><h3>Current Balance</h3><p class="balance-amount" id="balance">₹0.00</p></div>

            <div class="balance-card"><h3>This Month Spent</h3><p class="spent-amount" id="monthTotal">₹0.00</p></div>

            <div class="balance-card"><h3>Total Spent</h3><p class="spent-amount" id="totalSpent">₹0.00</p></div>

            <div class="balance-card"><h3>Total Credited</h3><p class="credit-amount" id="totalCredited">₹0.00</p></div>

        </div>

        <div class="sections">

            <div class="section"><h2>Add Credit</h2><form id="creditForm"><input type="number" step="0.01" min="0.01" id="creditAmount" placeholder="Amount" required><input type="text" id="creditNote" placeholder="Note"><button type="submit">Add</button></form></div>

            <div class="section"><h2>Add Expense</h2><form id="expenseForm"><input type="date" id="expenseDate" required><input type="number" step="0.01" min="0.01" id="expenseAmount" placeholder="Amount" required><input type="text" id="expenseDesc" placeholder="Description"><select id="expenseCategory" required></select><button type="submit">Add</button></form></div>

            <div class="section"><h2>Categories</h2><form id="categoryForm"><input type="text" id="categoryName" placeholder="New category" required><button type="submit">Add</button></form><div class="categories-list" id="categoriesList"></div></div>

        </div>

        <div class="section full-width"><h2>Monthly Trend</h2><canvas id="trendChart" height="100"></canvas></div>

        <div class="section full-width"><h2>By Category</h2><select id="statMonth"></select><div class="by-category" id="byCategory"></div><canvas id="catChart" height="80"></canvas></div>

        <div class="section full-width"><h2>All Expenses</h2><select id="monthFilter"></select><div class="expenses-table"><table id="expensesTable"><thead><tr><th>Date</th><th>Amount</th><th>Category</th><th>Description</th><th></th></tr></thead><tbody></tbody></table></div></div>

    </div>

    <script src="app.js"></script>

    <script>

        if ('serviceWorker' in navigator) {

            window.addEventListener('load', function () {

                navigator.serviceWorker.register('sw.js');

            });

        }

    </script>

</body>

</html>
